<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#12101A" />
    <meta name="description" content="음악 산업 안에서 자신만의 인생을 사는 오픈엔디드 라이프 시뮬레이션" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Music Empire" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Music Empire: The Music Life</title>
    <!-- Launch splash — painted before the app bundle loads, then faded out by
         main.jsx once React mounts, so opening the installed app feels native. -->
    <style>
      #app-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
        background:
          radial-gradient(900px 500px at 12% -8%, rgba(232,163,61,0.18), transparent 55%),
          radial-gradient(900px 600px at 100% 108%, rgba(139,127,209,0.18), transparent 55%),
          #0B0912;
        transition:opacity .45s ease;font-family:system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
      #app-splash.hide{opacity:0;pointer-events:none}
      #app-splash .spl-disc{width:76px;height:76px;border-radius:50%;
        background:conic-gradient(from 0deg,#E8A33D,#E893A6,#8B7FD1,#4FD1C5,#E8A33D);
        display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px rgba(232,163,61,0.35);animation:spl-spin 3.2s linear infinite}
      #app-splash .spl-disc::after{content:"";width:22px;height:22px;border-radius:50%;background:#0B0912;box-shadow:inset 0 0 0 4px rgba(255,255,255,0.15)}
      #app-splash .spl-name{color:#EDE9F0;font-size:20px;font-weight:800;letter-spacing:.5px}
      #app-splash .spl-sub{color:#8B8496;font-size:12px;margin-top:-10px}
      #app-splash .spl-bar{width:132px;height:3px;border-radius:2px;background:rgba(255,255,255,0.12);overflow:hidden}
      #app-splash .spl-bar i{display:block;height:100%;width:40%;border-radius:2px;background:linear-gradient(90deg,#E8A33D,#E893A6);animation:spl-load 1.1s ease-in-out infinite}
      @keyframes spl-spin{to{transform:rotate(360deg)}}
      @keyframes spl-load{0%{transform:translateX(-140%)}100%{transform:translateX(360%)}}
      @media (prefers-reduced-motion: reduce){#app-splash .spl-disc,#app-splash .spl-bar i{animation:none}}
    </style>
  </head>
  <body>
    <div id="app-splash">
      <div class="spl-disc"></div>
      <div class="spl-name">Music Empire</div>
      <div class="spl-sub">The Music Life</div>
      <div class="spl-bar"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
